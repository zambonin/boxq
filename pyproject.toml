[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "boxq"
version = "0.1.0"
description = "Compute and query cryptanalytic tables; export TeX, CSV, or DKVP"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]
readme = "README.txt"
license = "BSD-2-Clause"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.txt", "boxq/data/BOTAN-LICENSE.txt"]

[dependency-groups]
dev = ["pytest==9.0.2"]

[project.scripts]
boxq = "boxq.cli.main:main"

[tool.setuptools.packages.find]
include = ["boxq*"]

[tool.setuptools.package-data]
boxq = ["data/*.json", "data/*LICENSE*.txt", "_native/*.cpp", "_native/*.hpp", "_native/*/*.hpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
